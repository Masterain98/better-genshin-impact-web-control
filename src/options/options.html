<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>BGI Web Cloud Bridge - 高级设置</title>
  <style>
    body { font-family: "Segoe UI","Microsoft YaHei",sans-serif; background:#1e1f22; color:#e6e6e6; max-width:640px; margin:24px auto; padding:0 16px; font-size:14px; }
    h1 { font-size:18px; display:flex; align-items:center; gap:10px; }
    h1 .logo { width:28px; height:28px; border-radius:6px; }
    fieldset { border:1px solid #3a3d42; border-radius:8px; margin-bottom:16px; padding:12px 16px; }
    legend { color:#9aa0a6; padding:0 6px; }
    .field { display:flex; align-items:center; justify-content:space-between; margin:8px 0; }
    .field label { color:#cfd3d8; }
    input, select { background:#2b2d31; color:#e6e6e6; border:1px solid #3a3d42; border-radius:6px; padding:6px 8px; width:220px; }
    input[type=checkbox] { width:auto; }
    .hint { color:#9aa0a6; font-size:12px; margin-top:2px; }
    .bar { display:flex; gap:10px; align-items:center; margin-top:16px; }
    button { padding:8px 16px; border:none; border-radius:6px; background:#4f8cff; color:#fff; cursor:pointer; font-size:14px; }
    button.secondary { background:#2b2d31; color:#e6e6e6; }
    #saved { color:#46c37b; }
  </style>
</head>
<body>
  <h1><img src="../../public/icon32.png" alt="logo" class="logo" />BGI Web Cloud Bridge · 高级设置</h1>

  <fieldset>
    <legend>本地桥接连接</legend>
    <div class="field"><label>Host</label><input id="host" type="text" /></div>
    <div class="field"><label>Port</label><input id="port" type="number" min="1" max="65535" /></div>
    <div class="field"><label>Token（一次性令牌）</label><input id="token" type="text" placeholder="可留空（开发模式）" /></div>
    <div class="hint">仅监听回环地址；Token 正式版由 BetterGI 通过 Native Messaging 下发。</div>
  </fieldset>

  <fieldset>
    <legend>画面</legend>
    <div class="field"><label>逻辑宽</label><input id="logicalWidth" type="number" /></div>
    <div class="field"><label>逻辑高</label><input id="logicalHeight" type="number" /></div>
    <div class="field"><label>目标帧率</label>
      <select id="targetFps"><option>10</option><option>15</option><option>20</option></select>
    </div>
    <div class="field"><label>编码</label>
      <select id="codec"><option value="1">WebP</option><option value="0">JPEG</option></select>
    </div>
    <div class="field"><label>质量 (0-1)</label><input id="quality" type="number" step="0.05" min="0.1" max="1" /></div>
  </fieldset>

  <fieldset>
    <legend>相对鼠标灵敏度</legend>
    <div class="field"><label>Scale X</label><input id="relativeMouseScaleX" type="number" step="0.05" /></div>
    <div class="field"><label>Scale Y</label><input id="relativeMouseScaleY" type="number" step="0.05" /></div>
  </fieldset>

  <fieldset>
    <legend>稳定性</legend>
    <div class="field"><label>帧超时 (ms)</label><input id="frameTimeoutMs" type="number" /></div>
    <div class="field"><label>心跳间隔 (ms)</label><input id="heartbeatMs" type="number" /></div>
    <div class="field"><label>自动重连</label><input id="autoReconnect" type="checkbox" /></div>
  </fieldset>

  <div class="bar">
    <button id="save">保存</button>
    <button id="reset" class="secondary">恢复默认</button>
    <span id="saved"></span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
